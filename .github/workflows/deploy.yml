name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Restore raw data from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-
      - name: Refresh asteroids and stars from Fink
        id: fink
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/refresh_site.mjs --minutes 6
      - name: Refresh dark-matter alerts and meters
        id: dm
        timeout-minutes: 8
        continue-on-error: true
        run: python -I scripts/refresh_dm.py --minutes 6
      - name: Score the showcase
        id: showcase
        timeout-minutes: 5
        continue-on-error: true
        run: python -I scripts/build_showcase.py
      - name: Pick tonight's targets
        id: tonight
        timeout-minutes: 8
        continue-on-error: true
        run: python -I scripts/build_tonight.py --minutes 5
      - name: Keep the committed file for any mode whose refresh broke it
        if: always()
        run: |
          for f in site/data/*.json; do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; then
              echo "::warning::$f did not parse after the refresh; deploying the committed version"
              git checkout -- "$f"
              echo "$f" >> "$RUNNER_TEMP/fallbacks.txt"
            fi
          done
          git diff --stat -- site/data
      - name: Check who is silent upstream and how each refresh went
        if: always()
        timeout-minutes: 4
        env:
          STEP_STARS: ${{ steps.fink.outcome }}
          STEP_ASTEROIDS: ${{ steps.fink.outcome }}
          STEP_DM: ${{ steps.dm.outcome }}
          STEP_SHOWCASE: ${{ steps.showcase.outcome }}
          STEP_TONIGHT: ${{ steps.tonight.outcome }}
        run: python -I scripts/build_health.py --fallbacks "$RUNNER_TEMP/fallbacks.txt" || git checkout -- site/data/health.json
      - name: Build tonight's archive snapshot
        id: snapshot
        if: always()
        continue-on-error: true
        run: python -I scripts/build_archive.py --out "$RUNNER_TEMP/archive"
      - name: Hand the snapshot to the archive job
        if: steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: archive-snapshot
          path: ${{ runner.temp }}/archive
          retention-days: 3
      - name: Save raw data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: raw-data-${{ github.run_id }}
      - name: Site checks
        run: |
          node scripts/check_site.mjs
          node scripts/test_skycalc.mjs
      - name: Say why nothing was deployed
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Checked, but not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
      - name: Stamp asset URLs with the commit and data URLs with content hashes
        run: node scripts/stamp_versions.mjs site "${GITHUB_SHA::8}"
      - name: Create the Pages project on first run
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@3 pages project create observatory --production-branch=main || echo exists
      - name: Deploy site/ to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=observatory --branch=main

  archive:
    needs: pages
    if: ${{ always() && needs.pages.result != 'cancelled' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Fetch the snapshot
        id: get
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: archive-snapshot
          path: snapshot
      - name: Append the snapshot to the archive branch
        if: steps.get.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          file=$(ls snapshot/*.json.gz | head -n 1)
          name=$(basename "$file")
          year=${name:0:4}
          git init -q archive
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin archive; then
            git checkout -q -b archive FETCH_HEAD
          else
            git checkout -q --orphan archive
          fi
          cp ../src/scripts/archive-readme.md README.md
          mkdir -p "snapshots/$year"
          cp "../$file" "snapshots/$year/$name"
          git add README.md "snapshots/$year/$name"
          if git diff --cached --quiet; then
            echo "nothing new to archive"
          else
            git commit -q -m "Snapshot ${name%.json.gz}"
            git push -q origin archive
            echo "archived snapshots/$year/$name"
          fi

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the schedule alive with an empty commit after 50 quiet days
        run: |
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "last commit is $age days old"
          if [ "$age" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the nightly data refresh enabled"
            git push
          fi
